[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-monitoria-calculo3"
version = "0.1.0"
description = "Bot de Discord para auxílio a monitorias de Cálculo 3"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Monitoria de Cálculo 3" }
]
dependencies = [
    "discord.py>=2.4.0,<3.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitoria_bot = ["schema.sql"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
